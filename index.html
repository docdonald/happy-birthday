# 妹妹，22岁生日快乐——这是一份教你「钱生钱」的礼物

这份礼物不是裙子，不是口红，是一篇讲钱的文字。你可能觉得奇怪，生日送这个？先别急，听我说完。

《小狗钱钱》里有个很简单的故事：那只叫钱钱的拉布拉多犬，教小女孩吉娅把钱分成三份——一份日常花销，一份用来实现梦想，一份变成「鹅」。鹅会下金蛋，但鹅不能杀，杀了一只鹅就没了金蛋。理财说白了就是养鹅：先攒本金，再让本金给你生钱。很多人每月工资花光光，等于亲手把鹅杀了吃肉。

《纳瓦尔宝典》里有一句话我特别喜欢：**财富是你在睡觉的时候，还能帮你赚钱的资产。** 上班赚钱，是在用时间换钱；时间卖完了，收入就停了。而投资，是把你现在挣的钱，慢慢变成能自己产生现金流的资产。等这些资产产生的钱够你生活了，你就不用再为钱发愁，可以去做真正想做的事——这才是财务自由。

学校不教这些。学校里教微积分、教文言文，就是不教怎么管钱。可等你出了校门，发现一辈子都要跟钱打交道：工资怎么花、房贷怎么还、以后孩子的教育金怎么准备、养老怎么办……没人替你打理。

所以我写这篇东西给你。不指望你马上变成投资高手，只希望你能在22岁这年，把「钱生钱」这个道理想明白。早点明白，比赚多少钱都值。

---

## 一、先认识一下：市面上到底有哪些投资品种

别被理财APP上五花八门的产品吓到，掰着手指头数，其实就五大类。

**一、存款。** 你把钱放银行，银行付你利息。现在一年期定期存款利率大概1.5%左右。安全是真的安全，但钱会「缩水」——因为物价每年都在涨。你存1万块，一年后拿到10150块，可东西贵了3%，你实际购买力反而下降了。存钱只能保证不丢，不能保证不亏。

**二、债券。** 债券就是你借钱给别人——借给国家叫国债，借给公司叫公司债。对方给你打一张欠条，到期还本付息。国债风险很低，收益也不高，比存款强一点点。公司债风险高一些、利息也高一些，但公司要是破产，钱可能打水漂。

**三、股票。** 股票是买一家公司的股份，公司赚钱你能分红，股价涨了你卖掉能赚差价。但问题是：你怎么知道哪家公司能赚钱？A股几千家公司，有造假退市的、有业绩变脸的，别说普通人，专业基金经理也经常看走眼。买股票好比在几百个学生里猜谁能考清华，押中了发财，押错了伤筋动骨。

**四、基金。** 基金是你把钱交给基金经理，他帮你买一堆股票和债券。相当于你出钱、他出专业能力。基金又分两类：一类叫主动基金，基金经理自己琢磨买什么，赌他水平高；另一类叫指数基金，不靠经理选股，按照一个早就定好的规则买。

**五、ETF。** ETF是指数基金的一种，但它能像股票一样在股票账户里随时买卖。普通人买指数基金，最方便的就是买ETF。这个下面细说。

这五大类里，前两类太保守，跑不赢通胀；第三类风险太大，普通人没本事挑个股；第四类费用高，还得赌经理的水平。所以普通人最适合的，是ETF。

---

## 二、为什么选ETF？——一个「打包」的思维

想象一下，你想在美食城里入股最好吃的10家店。一家一家去谈，要跑10趟、签10份合同、投10笔钱，还得天天盯着每家的生意——这就是买股票。

现在有人把这10家店打包成一个套餐，你买一份，就等于同时入股了10家店。这个套餐每天有价格，随时能买能卖——这就是ETF。

ETF有四个实实在在的好处：

- **省心**：不用研究个股。你看好中国消费，但不知道买茅台还是伊利，直接买个消费ETF，一篮子全包了。你看好科技，不用纠结苹果还是微软，纳指ETF帮你打包好了。
- **不会死**：单一股票可能退市、造假，但你买的一篮子东西，个别公司出了问题，整体影响很小。何况指数还会定期调整成分股，把差公司踢出去，把好公司换进来。单棵树会枯，森林不会。
- **便宜**：主动基金一年管理费普遍1.5%（不管赚不赚钱你都得交），ETF很多只要0.15%~0.5%。一年差一个多点，几十年复利下来差距吓死人。
- **方便**：100块就能投，股票账户里输代码就能买，跟买股票一样快。部分跨境ETF还能当天买当天卖。

一句话：ETF就是给普通人设计的「躺赢工具」——用最少的钱、最少的时间，拿市场平均回报。

---

## 三、ETF上千只，为什么就选纳指、标普、红利这三个？

市面上的ETF多得数不清，消费、医药、半导体、军工、新能源……为什么我只给你挑这三个？因为它们分别代表三种完全不同的赚钱路子，组合在一起就是「进可攻、退可守」。

### 纳指ETF——买「全球最能赚钱的科技公司」

纳指全称纳斯达克100指数，跟踪的是在美国纳斯达克上市的100家最大的非金融公司：苹果、微软、谷歌、亚马逊、英伟达、特斯拉……你每天用的手机、看的视频、网购的网站，背后几乎都是这些公司。

它们有个共同点：掌握全球最核心的技术，盈利能力强得离谱。过去几十年，中间虽然也经历过暴跌，但整体一直往上走。只要人类还在用手机、用互联网、用AI，这些公司大概率还会继续赚钱。

买纳指，本质上是买「全球科技进步」这个大趋势，是跟最会赚钱的公司站在一起。

### 标普500ETF——买「美国经济」本身

标普500由美国500家最大的上市公司组成，覆盖美国股市约80%的市值，各行各业都有——科技、金融、医疗、消费、工业。它不押注任何一个行业，而是押注整个美国经济的长期向上。

巴菲特有句名言：对普通人来说，最好的选择就是长期定投标普500指数。他遗嘱里写了，留给家人的钱，90%要买标普500。

买标普500，等于让美国最优秀的500家大公司给你打工。省心到了极致。

### 红利ETF——买「愿意给你分钱的铁公鸡」

红利ETF专挑股息率高的股票——这些公司股价可能涨得没那么猛，但每年赚了钱，愿意拿出真金白银分给股东。

你可以把它理解成一间收租的铺子：买下之后，每年都有分红进账，就像房东收房租。哪怕市场大跌、股价跌了，只要公司还在赚钱、还在分红，你每年依然有现金入账。

A股经典的中证红利指数，选的是沪深两市股息率最高的100只股票，大多是银行、能源、交通运输这类盈利稳定的大公司。历史表现不输大部分指数，波动更小、更抗跌。

### 为什么非要配一份红利？

因为纳指和标普长期向上，但中间可能跌掉30%。你要是全仓它们，跌的时候心态可能崩了，一恐慌就卖在底部，后面涨上来又后悔。而红利类资产就像压舱石——市场差的时候它少跌一点、还给你分红。有了它，整个组合才拿得住。

---

## 四、为什么用定投，不一把梭？

好，你已经知道买什么了。但还有个问题：一次全买，还是分批买？

答案是：**分批买，每个月固定投一笔。这就是定投。**

打个比方。你今天去菜市场买土豆，土豆今天10块钱一斤。你买不买？万一明天跌到5块呢？你不可能预知价格。但如果你每周都买100块钱土豆——有时候买贵了只能买10斤，有时候便宜能买20斤——时间长了，你的平均成本会被拉得很低。等土豆涨到15块，你就赚了。

定投的本质，是承认自己猜不准市场。没有人能精准抄底，也没人能精准逃顶。既然猜不准，就用分批买入来摊平成本：市场跌的时候，同样的钱能买更多份额；市场涨的时候，你买得少。长期下来，你的平均成本一定不会是最高的。

而且定投对心态特别友好。你一次性投10万，市场跌10%，亏1万，你可能晚上睡不着。但每月投1000块，市场跌了，你反而开心——因为买到更便宜的筹码了，以后涨起来赚更多。

定投不需要技术，只需要纪律：每个月固定拿出一笔钱，固定买入，风雨无阻。

---

## 五、具体怎么做？手把手教程

先回答一个关键问题：**买这三样，不一定要开证券账户。**

支付宝、微众银行这些你手机里可能已经有的App，都能直接定投场外的纳指、标普和红利基金。而且说实话，最近一段时间，先别急着开证券账户去买场内的纳指ETF和标普500ETF——因为它们的溢价率比较高，在场内买等于买贵了。

什么是溢价？简单说，场内ETF有两个价格：一个是它背后那篮子股票的真实价值（净值），一个是大家在交易所里买卖的价格。当想买的人太多、场内份额不够卖时，交易价格就会被推得比真实价值高，高出来的部分就叫溢价。纳指、标普这类跨境ETF，因为受QDII外汇额度限制，场外申购经常限购或暂停，想买的人涌到场内，溢价就被炒起来了。有的纳指ETF溢价曾经超过15%。如果你溢价买进去，万一哪天溢价消失，光这一块就可能亏掉好几个点。

### 方式一：开证券账户，场内买ETF

这个方式适合愿意开股票账户、觉得场内操作方便的人。

1. **开户**：现在的券商APP都能在线开户，几分钟搞定。
2. **定投金额**：月薪7000，建议每月700~1500元（10%~20%）。先把3~6个月生活费留作紧急备用金，再开始。
3. **分配比例**：40%纳指、30%标普、30%红利。
4. **买入动作**：每个月发工资后第二天，打开券商APP，输入代码买入。
5. **止盈线**：总收益到50%~100%时，卖一部分落袋为安，然后继续定投。

> ⚠️ **但是，在场内买纳指ETF、标普500ETF之前，一定先看一眼溢价率**——券商APP上一般都会显示。溢价超过1.5%就别买了，这时候钱被“贵”的部分吃掉了，不划算。遇到这种情况，就转到下面的方式二或方式三，去场外买。
>
> 红利ETF是A股资产，没有外汇额度问题，溢价风险很小，可以正常买。

### 方式二：不开户，用支付宝定投（最省事，最推荐）

1. 打开支付宝 → 点「理财」→ 点「基金」。
2. 搜索“纳斯达克100”或“标普500”，会出现一批跟踪这两个指数的场外基金。
3. **选C类份额**。这里解释一下：基金分A类和C类。A类买入时收申购费（虽然平台打折后不贵），C类买入时不收申购费，但每年收一点点销售服务费。定投是细水长流、金额不大，选C类通常更划算。你在产品页面上对比一下费率，哪个低选哪个就行。
4. 点「定投」，设置金额（比如每月1000元）、周期（每周或每月都行）、扣款日期（建议设在发工资后第二天）。
5. **分红方式选「红利再投资」**——分红不要取出来，让它继续买入基金份额，这样才能发挥复利的效果。
6. 设置完就不用管了，支付宝每月自动扣款。

> ✅ **关键好处**：场外基金是按净值成交的，不存在场内那种溢价问题，你每一分钱都花在“真实价值”上。

### 方式三：不开户，用微众银行定投

如果你习惯用微众银行，操作逻辑和支付宝几乎一样：

1. 打开微众银行APP → 点「理财」→ 点「基金」。
2. 搜索“纳斯达克100”或“标普500”，找到对应的场外基金。
3. 同样选C类份额，点「定投」，设置金额、周期、扣款日期。
4. 分红方式选「红利再投资」。

微众银行是银行背景，基金申购费同样有折扣，买入和赎回的规则跟支付宝一致，按净值成交，也没有溢价问题。

### 补充几点

- **红利基金场外也能买。** 就算不开证券账户，在支付宝或微众银行搜索“中证红利”或“红利低波”，也能找到对应的场外指数基金，按同样方式定投。也就是说，不开户也能把40%纳指、30%标普、30%红利的配置完整落地。
- **QDII基金可能会限购。** 有时会遇到“暂停申购”或“单日限购”的提示，这是外汇额度原因，不是基金出问题了。遇到限购，可以先买额度没满的那只，或等开放后再买，不用慌。
- **场外申购费很低。** 支付宝、微众银行这类平台买场外基金，申购费普遍打1折，大约0.1%~0.15%，成本几乎可以忽略。

**最终建议：首选支付宝或微众银行做场外定投，省心、无溢价、门槛低，100块就能开始。** 如果以后想玩场内、愿意开户，再配一个证券账户，注意避开高溢价的纳指和标普ETF就行。红利ETF场内场外都可以，看哪个方便。

---

## 六、三针心理预防针

最后，提前给你打个思想底子。投资到最后，拼的不是脑子，是心态。

**第一针：别追涨杀跌。** 90%的人亏钱就是因为这个。看到大涨忍不住冲进去，买在高位；看到自己的跌了就恐慌卖出，卖在底部。记住一句话：别人贪婪时我恐惧，别人恐惧时我贪婪。如果你做不到逆向操作，至少做到「涨了拿得住，跌了敢加仓」。

**第二针：别把所有钱都投进去。** 投资是为了让生活更好，不是更焦虑。永远留足应急钱，只用闲钱投资——就是三五年内用不到的钱。22岁的你最大的优势是时间：就算市场跌了，你有足够时间等它涨回来。时间是复利的朋友。

**第三针：别听「内幕消息」。** 亲戚朋友推荐你买什么股票，一律不听。普通人最大的优势不是信息多，恰恰是承认自己没信息优势。买指数，就是承认自己不可能每次都能选中最好的股票，但愿意拿市场平均回报——而仅仅是这个平均回报，已经能跑赢大多数人。

---

## 写在最后

妹妹，22岁是个神奇的年纪。你每月拿出1000块定投，可能只是少买几件衣服、少喝几杯奶茶。但坚持到50岁，按年化8%~10%算，大概率能攒下一笔改变人生的钱。

真正的财富自由，不是账户数字有多大，而是被动收入能覆盖生活支出。你不需要成为投资天才，只需要做时间的朋友，让复利为你工作。

这三只ETF——纳指、标普500、红利——不是一个一夜暴富的方案，而是一套慢慢变富的框架。它不一定最赚钱，但它能让一个22岁、月薪7000的普通女孩，在完全不焦虑、不折腾、不影响正常生活的前提下，稳稳地走上财富积累的路。

吹蜡烛的时候，许个愿：希望十年后的你，感谢今天开始定投的自己。

生日快乐，妹妹。愿你一生可爱，一生富足。

2026年10月15日

<rect x="84" y="60" width="32" height="7" rx="3" fill="#e2779a"/><ellipse cx="166" cy="112" rx="14" ry="12" fill="#f9c6d5"/><circle cx="162" cy="110" r="2.5" fill="#d0628a"/><circle cx="170" cy="110" r="2.5" fill="#d0628a"/><circle cx="140" cy="94" r="4" fill="#4a3a42"/><path d="M60 66l-8-16 22 8z" fill="#f9c6d5"/><rect x="60" y="154" width="14" height="18" rx="5" fill="#f7a8c0"/><rect x="126" y="154" width="14" height="18" rx="5" fill="#f7a8c0"/><path d="M30 104q-14-4-10 10" stroke="#f7a8c0" stroke-width="3" fill="none"/><text id="pigt" x="100" y="120" font-size="16" text-anchor="middle" fill="#e2779a" font-weight="800"></text></svg>`;
/* 每节插画（按标题匹配） */
const SEC_ART=[['妹妹',null],['一、','book'],['二、','pkg'],['三、',null],['四、','potato'],['五、','phone'],['六、','vaccine'],['写在最后','cake'],['附：','cards']];
const PARA_ART=[['《小狗钱钱》','goose'],['《纳瓦尔宝典》','moon'],['学校不教','school'],['所以我写','heart'],['ETF有四个','shield']];
/* ---- 解析 Markdown 为屏 ---- */
const md=$('#content').textContent.trim().split('\n');
const story=$('#story');let html='',buf=[],list=null,q=[],tb=[],chap=0,inCandy=false,candy='';
const CANDY_C=['#eef6ff','#f3efff','#fff0f4','#fff4ea','#fdf0ff'],CANDY_I=['🏦','📜','📈','🧺','🍬'];let ci=0;
function block(h){html+=`<section class="screen"><div class="r">${h}</div></section>`}
function flushList(){if(list){block('<div class="glass"><'+list+'>'+buf.join('')+'</'+list+'></div>');buf=[];list=null}
 if(q.length){block('<div class="glass">'+q.filter(Boolean).map(x=>'<p>'+inl(x)+'</p>').join('')+'</div>');q=[]}
 if(tb.length){block('<div class="glass tw"><table>'+tb.filter(r=>!/^\|[-| ]+\|$/.test(r)).map((r,k)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>(k?'<td>':'<th>')+inl(c.trim())+(k?'</td>':'</th>')).join('')+'</tr>').join('')+'</table></div>');tb=[]}}
for(const raw of md){const l=raw.trim();let m;
 if(inCandy&&!/^\*\*[一二三四五]、/.test(l)&&l){ if(candy){candy+='</div></div>';html+=candy;candy=''} html+='</div></div></section>';inCandy=false}
 if(l.startsWith('>')){q.push(l.replace(/^>\s?/,''));continue}
 if(l.startsWith('|')){tb.push(l);continue}
 if((m=l.match(/^\d+\.\s(.*)/))){if(list!=='ol')flushList();list='ol';buf.push('<li>'+inl(m[1])+'</li>');continue}
 if(l.startsWith('- ')){if(list!=='ul')flushList();list='ul';buf.push('<li>'+inl(l.slice(2))+'</li>');continue}
 flushList();if(!l||l==='---')continue;
 if((m=l.match(/^(#{1,3})\s(.*)/))){const t=m[2];
   if(m[1]==='#'){html+=`<section class="screen chap"><div class="r ill" data-p=".15">${ART.cake}</div><h1 class="t r">${ttl(t)}</h1></section>`;continue}
   if(m[1]==='##'){const a=SEC_ART.find(s=>t.startsWith(s[0]));const parts=t.match(/^(.+?、)(.*)$/);
     html+=`<section class="screen chap"><div class="r ill" data-p=".2">${a&&a[1]?ART[a[1]]:'<div class="trioic">'+Object.values(MASCOT).join('')+'</div>'}</div><h2 class="r">${parts?'<span class="no">'+inl(parts[1])+'</span>'+ttl(parts[2]):ttl(t)}</h2></section>`;
     if(t.startsWith('四、'))html+=`<div id="pigwrap">${PIG}</div>`;continue}
   const mk=Object.keys(MASCOT).find(k=>t.startsWith(k));
   block(mk?`<div class="mascot">${MASCOT[mk]}<h3>${ttl(t)}</h3></div>`:`<h3>${ttl(t)}</h3>`);continue}
 /* 投资品种糖果卡 */
 if((m=l.match(/^\*\*([一二三四五]、)(.+?)。\*\*\s(.*)$/))){
   if(!inCandy){html+='<section class="screen"><div class="r"><p class="tapme" style="margin:0 0 12px">🍬 点开每一颗糖果看看</p><div class="candies">';inCandy=true}
   html+=`<div class="candy" style="background:${CANDY_C[ci]}" onclick="const o=this.classList.contains('on');this.parentNode.querySelectorAll('.candy').forEach(c=>c.classList.remove('on'));if(!o)this.classList.add('on');fit(this.closest('section'))"><div class="ic">${CANDY_I[ci++]}</div><div class="nm">${esc(m[1])}${esc(m[2])}。</div><div class="bd"><p>${inl(m[3])}</p></div><div class="hint">点我打开</div></div>`;continue}
 const pa=PARA_ART.find(s=>l.startsWith(s[0]));
 if(l.startsWith('现在有人把这10家店打包'))html+=`<section class="screen"><div class="r ill" data-p=".1">${BASKET()}</div><p class="tapme r"><span class="tag">点我</span> 🧺 点一下果篮</p></section>`;
 if(pa)html+=`<section class="screen" style="min-height:0;padding:4vh 0 0"><div class="r ill" data-p=".18">${ART[pa[1]]}</div></section>`;
 block('<p>'+inl(l)+'</p>');
 if(l.startsWith('答案是：分批买'))html+='<div class="coinmark"></div>';
}
flushList();
function BASKET(){let f='';const fr=[['#ff8fa8',60,62],['#ffb27a',84,54],['#c9a8ff',108,60],['#ffd36e',132,54],['#9ed9a8',72,44],['#f7a8c0',96,40],['#ffcfb3',120,44],['#b58cf0',144,62],['#ff8fa8',48,52],['#ffd36e',156,48]];
 fr.forEach(([c,x,y],i)=>{const a=(i/fr.length)*Math.PI*2;f+=`<circle class="fruit" data-dx="${Math.cos(a)*70|0}" data-dy="${Math.sin(a)*50-30|0}" cx="${x}" cy="${y}" r="13" fill="${c}"/>`});
 return `<svg id="basket" viewBox="-30 -50 260 220">${f}<path d="M30 66h140l-16 76H46z" fill="#fff1e6" stroke="#ffb27a" stroke-width="4"/><path d="M40 86h120M44 106h112M48 126h104" stroke="#ffd9bf" stroke-width="3"/><path d="M50 66q50-60 100 0" fill="none" stroke="#ffb27a" stroke-width="5"/><text x="100" y="118" text-anchor="middle" font-weight="800" fill="#e2779a" font-size="18">ETF</text></svg>`}
story.innerHTML=html;
/* 果篮交互 */
const bk=$('#basket');if(bk)bk.onclick=()=>{bk.classList.toggle('x');bk.querySelectorAll('.fruit').forEach(f=>f.style.transform=bk.classList.contains('x')?`translate(${f.dataset.dx}px,${f.dataset.dy}px)`:'')};
/* ---- 组装成「一屏一页」 ---- */
// 只有插画的屏 → 并入下一屏
[...story.querySelectorAll(':scope>section[style*="min-height:0"]')].forEach(s=>{const n=s.nextElementSibling;if(n&&n.tagName==='SECTION'){const ill=s.querySelector('.ill');n.insertBefore(ill,n.firstChild);s.remove()}});
// 只有小标题的屏 → 并入下一屏；落款日期 → 并入上一屏
[...story.querySelectorAll(':scope>section.screen:not(.chap)')].forEach(s=>{const r=s.querySelector('.r');if(r&&r.children.length===1&&r.querySelector(':scope>h3,:scope>.mascot')){const n=s.nextElementSibling;if(n&&n.tagName==='SECTION'&&!n.classList.contains('chap')){n.querySelector('.r').prepend(r.firstElementChild);s.remove()}}});
[...story.querySelectorAll(':scope>section')].forEach(s=>{if(/^\d{4}年\d+月\d+日$/.test(s.innerText.trim())){const p=s.previousElementSibling;p.querySelector('.r').append(...s.querySelector('.r').children);s.remove()}});
// 存钱罐移到右下角
const pw=$('#pigwrap');$('#pigdock').innerHTML=pw.innerHTML;pw.remove();
story.querySelectorAll('.coinmark').forEach(e=>e.remove());
// 段落合并：同一章内、非互动屏，按原段落顺序合并，必须不溢出
const isW=s=>s.querySelector('.candies,#basket');
{let secs=[...story.querySelectorAll(':scope>section')];let g=secs[0],cnt=1;
 for(let i=1;i<secs.length;i++){const n=secs[i];
  if(n.classList.contains('chap')||g.classList.contains('chap')||isW(n)||isW(g)||cnt>=4){g=n;cnt=1;continue}
  const moved=[...n.children];g.append(...moved);
  const cs=getComputedStyle(g),avail=g.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-12;let need=0;[...g.children].forEach(c=>{const m=getComputedStyle(c);need+=c.offsetHeight+parseFloat(m.marginTop)+parseFloat(m.marginBottom)});
  if(need>avail||g.innerText.replace(/\s/g,'').length>520){n.append(...moved);g=n;cnt=1}else{n.remove();cnt++}}}
story.appendChild($('#card'));
const slides=[...story.children];const N=slides.length;
const chapOf=[];let ch=-1;const chaps=[];slides.forEach((s,i)=>{if(s.classList.contains('chap')){ch++;const t=s.querySelector('h1,h2').textContent.replace(/\s+/g,'').trim();chaps.push({i,t})}chapOf.push(Math.max(ch,0))});
const label=c=>{const t=chaps[c].t;const m=t.match(/^([一二三四五六])、\s*(.*)$/);return m?m[1]+' · '+m[2]:t};
$('#tocl').innerHTML=chaps.map((c,k)=>`<button data-i="${c.i}">${esc(label(k))}</button>`).join('');
$('#chapl').onclick=()=>$('#toc').classList.add('on');$('#toc').onclick=e=>{const b=e.target.closest('button[data-i]');if(b)go(+b.dataset.i);$('#toc').classList.remove('on')};
$('#arrL').onclick=()=>go(cur-1);$('#arrR').onclick=()=>go(cur+1);
// 自动缩字：先缩字号，仍放不下才允许内部滚动
function fit(s){s.classList.remove('fit');const els=[...s.querySelectorAll('p,li,td,th,h3')];els.forEach(e=>e.style.fontSize='');
 let k=0;while(s.scrollHeight>s.clientHeight+2&&k<7){k++;els.forEach(e=>e.style.fontSize=(parseFloat(getComputedStyle(e).fontSize)*0.94)+'px')}
 if(s.scrollHeight>s.clientHeight+2)s.classList.add('fit');}
const coinsG=$('#coins'),fillR=$('#fill'),pigt=$('#pigt');let cur=-1,maxSeen=0,full=false;
function dropCoin(){const c=document.createElementNS('http://www.w3.org/2000/svg','g');c.innerHTML='<circle r="10" fill="#ffd36e" stroke="#e8b24a" stroke-width="2"/><text y="4" font-size="10" text-anchor="middle" fill="#a0702a">¥</text>';c.setAttribute('class','coin');c.style.transform='translate(100px,0px)';coinsG.appendChild(c);requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transform='translate(100px,66px)';setTimeout(()=>c.remove(),650)}));plink(880+Math.min(maxSeen,30)*15,.07)}
function setFill(){const p=Math.min(1,maxSeen/(N-1));fillR.setAttribute('height',p*104);fillR.setAttribute('y',164-p*104);pigt.textContent=maxSeen?('×'+maxSeen):''}
function go(n){n=Math.max(0,Math.min(N-1,n));if(n===cur)return;
 if(cur>=0)slides[cur].classList.remove('cur');cur=n;const s=slides[cur];s.classList.add('cur');s.scrollTop=0;fit(s);
 $('#pbar b').style.width=((cur+1)/N*100)+'%';$('#chapl').textContent=label(chapOf[cur])+'  ▾';
 if(cur>maxSeen){maxSeen=cur;dropCoin();setFill()}
 const end=cur===N-1;$('#pigdock').classList.toggle('big',end&&false);
 if(end&&!full){full=true;fillR.setAttribute('height',104);fillR.setAttribute('y',60);setTimeout(ding,300)}}
const INTER='.candy,#basket,#mute,.tw,a,button,#bars,#toc';
document.addEventListener('click',e=>{if(!document.body.classList.contains('started')||e.target.closest(INTER)||e.target.closest('#intro'))return;
 if(e.clientX<innerWidth*.3)go(cur-1);else go(cur+1)});
let sx=0,sy=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)&&!e.target.closest('.tw')){e.preventDefault();go(cur+(dx<0?1:-1))}},{passive:false});
document.addEventListener('keydown',e=>{if(!document.body.classList.contains('started'))return;if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key))go(cur+1);if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))go(cur-1)});
addEventListener('resize',()=>cur>=0&&fit(slides[cur]));
function startStories(){document.body.classList.add('started');['#bars','#pigdock','#hint'].forEach(s=>$(s).style.opacity=1);let seen=false;try{seen=localStorage.getItem('hb_hint')}catch(e){}if(seen)$('#hint').style.display='none';else{$('#hint').classList.add('play');try{localStorage.setItem('hb_hint',1)}catch(e){}setTimeout(()=>$('#hint').style.opacity=0,4200)}go(0)}
/* 音乐（WebAudio 合成音乐盒） */
let ctx,master,on=true;
function note(m,t,d,v,type='sine'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1)}
function plink(f,v){if(!ctx)return;const m=69+12*Math.log2(f/440);note(m,ctx.currentTime,.4,v,'triangle')}
function ding(){if(!ctx)return;const t=ctx.currentTime;[84,88,91,96].forEach((m,i)=>note(m,t+i*.12,1.6,.22))}
function startMusic(){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.16;master.connect(ctx.destination);
 const prog=[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,67]];let s=0;
 const bar=()=>{const t=ctx.currentTime+.05,c=prog[s++%4];note(c[0]-12,t,3.8,.25);[0,1,2,3,2,1,0,2].forEach((k,i)=>note(c[k]+12,t+i*.5,1.6,.12))};bar();setInterval(bar,4000)}
$('#mute').onclick=()=>{on=!on;master.gain.setTargetAtTime(on?.16:0,ctx.currentTime,.1);$('#mute').textContent=on?'🔊':'🔇'};
$('#giftsvg').onclick=()=>{const I=$('#intro');if(I.classList.contains('open'))return;I.classList.add('open');try{startMusic();$('#mute').style.display='block'}catch(e){}
 setTimeout(()=>{I.classList.add('gone');document.body.classList.remove('locked');startStories()},2600)};
</script></body></html>
